name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.115

      - name: Verify pinned SDK
        shell: pwsh
        run: |
          $expected = (Get-Content global.json | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($actual -ne $expected) {
            throw "SDK mismatch: global.json pins $expected but dotnet resolves $actual"
          }

      - name: Restore
        run: dotnet restore Sentinel.slnx

      - name: Build
        run: dotnet build Sentinel.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Sentinel.slnx -c Release --no-build

      - name: Build release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/build-release.ps1 -Version $version -OutputDir out/release

      - name: Upload release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ github.ref_name }}-win-x64
          path: |
            out/release/sentinel-*.zip
            out/release/packages/*.nupkg
            out/release/SHA256SUMS.txt
            out/release/release.json
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          gh release create $env:GITHUB_REF_NAME `
            "out/release/sentinel-$version-win-x64.zip" `
            "out/release/packages/Sentinel.Core.$version.nupkg" `
            "out/release/packages/Sentinel.Windows.$version.nupkg" `
            out/release/SHA256SUMS.txt `
            out/release/release.json `
            --title "Sentinel $env:GITHUB_REF_NAME" `
            --generate-notes
